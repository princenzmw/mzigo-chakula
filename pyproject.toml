[project]
name = "mzigo-chakula"
version = "0.1.0"
description = "Kenya food price inflation and household affordability data profiling and BI validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mzigo_chakula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
